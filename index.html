  <div class="row" style="margin-bottom:12px"><div class="seg"><button data-s="z" class="${sub==='z'?'on':''}">Zeiten (${r.entries.length})</button><button data-s="f" class="${sub==='f'?'on':''}">Fahrtenbuch (${r.trips.length})</button></div>${r.approved?`<span class="chip ok">Monat freigegeben von ${esc(r.approved.by)} · ${dt2(r.approved.at)}</span><button class="ghost sm" id="ua">Freigabe aufheben</button>`:`<button class="ghost sm" id="ap">Monat freigeben</button>`}<span class="grow"></span>${sub==='z'?'<button class="pri sm" id="ne">+ Zeit nachtragen</button>':''}<button class="ghost sm" id="csv">${sub==='z'?'Zeiten':'Fahrtenbuch'} als CSV</button></div>
  ${r.locks.length?`<div class="note">Fahrtenbuch abgeschlossen: ${r.locks.map(l=>esc(l.a)+' am '+dt2(l.ts)).join('; ')}</div>`:''}
  ${sub==='z'?(r.entries.length?`<div class="tw"><table><thead><tr><th>Datum</th><th>Start</th><th>Ende</th><th class="n">Pause</th><th class="n">Netto</th><th>Tätigkeit</th><th>Notiz</th><th></th></tr></thead><tbody>${r.entries.map((e,i)=>`<tr><td>${d2(e.s)}</td><td>${t2(e.s)}</td><td>${t2(e.e)}</td><td class="n">${Math.round(e.p/60000)} min</td><td class="n">${hm(Math.max(0,(e.e-e.s-e.p)/1000))}</td><td>${esc(e.act)}</td><td>${esc(e.note)}</td><td>${e.id?`<button class="ghost sm" data-ee="${i}">Bearbeiten</button>`:'<small class="mut">alt</small>'}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Summe</td><td class="n">${hm(tot)} h</td><td colspan="3"></td></tr></tfoot></table></div>`:'<div class="card empty"><big>🕒</big>Keine Zeiten in diesem Monat.</div>')
  :(r.trips.length?`<div class="tw"><table><thead><tr><th>Datum</th><th>Fahrzeug</th><th class="n">km Start</th><th class="n">km Ende</th><th class="n">km</th><th>Von → Nach</th><th>Zweck</th><th>Getankt</th></tr></thead><tbody>${r.trips.map(t=>`<tr><td>${d2(t.s)} ${t2(t.s)}</td><td>${esc(t.veh)}</td><td class="n">${t.kmS}</td><td class="n">${t.kmE}</td><td class="n">${Math.max(0,t.kmE-t.kmS)}</td><td>${esc(t.from)} → ${esc(t.to)}</td><td>${esc(t.purpose)}</td><td>${t.fuel?'<span class="chip warn">⛽ '+(t.liters?String(t.liters).replace('.',',')+' l':'ja')+'</span>':''}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Summe</td><td class="n">${km} km</td><td colspan="3"></td></tr></tfoot></table></div>`:'<div class="card empty"><big>🚐</big>Keine Fahrten in diesem Monat.</div>')}`;
  $('bk').onclick=()=>{cur=null;start()};
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{month=mshift(month,+b.dataset.m);render()});
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
  $('cb').onclick=async()=>{const a=await act('setCfg',{user:cur,goal:$('cg').value,acts:$('ca').value.split('\n')},()=>{});if(a){await act('setVacation',{user:cur,days:$('cv').value},render)}};
  if($('rb'))$('rb').onclick=()=>act('setRights',{user:cur,off:[...v.querySelectorAll('[data-rk]')].filter(c=>!c.checked).map(c=>c.dataset.rk)},()=>{});
  if($('ab'))$('ab').onclick=()=>act('setAdminRights',{user:cur,web:$('aw').value,off:[...v.querySelectorAll('[data-ap]')].filter(c=>!c.checked).map(c=>c.dataset.ap)},()=>{});
  if($('ap'))$('ap').onclick=()=>act('approveMonth',{user:cur,month:r.month});
  if($('ua'))$('ua').onclick=()=>act('unapproveMonth',{user:cur,month:r.month});
  const editE=async(e)=>{const f=await form(e?'Zeit bearbeiten':'Zeit nachtragen',[{k:'date',l:'Datum',t:'date',v:e?iso(e.s):iso(Date.now())},{k:'pause',l:'Pause (Min.)',t:'number',v:e?Math.round(e.p/60000):0},{k:'from',l:'Start',t:'time',v:e?t2(e.s):'08:00'},{k:'to',l:'Ende',t:'time',v:e?t2(e.e):'16:00'},{k:'act',l:'Tätigkeit',v:e?e.act:'',ph:(u.acts||[]).slice(0,3).join(', ')},{k:'note',l:'Notiz',v:e?e.note:''},{k:'reason',l:'Grund der Änderung (Pflicht, wird protokolliert)',t:'textarea',rows:2,ph:'z. B. Ausstempeln vergessen'}],'Speichern','Die App der Person übernimmt die Änderung beim nächsten Abgleich. Ende nach Mitternacht: Datum und Ende bleiben am Starttag, max. 24 h.',e?'Löschen':null);
    if(!f)return;if(f.__x){const g=await form('Eintrag löschen',[{k:'reason',l:'Grund (Pflicht)',t:'textarea',rows:2}],'Löschen');if(g&&g.reason.trim())act('entrySave',{user:cur,id:e.id,del:true,reason:g.reason});else if(g)toast('Bitte einen Grund angeben.',true);return}
    act('entrySave',{user:cur,id:e?e.id:'',date:f.date,from:f.from,to:f.to,pause:f.pause,act:f.act,note:f.note,reason:f.reason})};
  v.querySelectorAll('[data-ee]').forEach(b=>b.onclick=()=>editE(r.entries[+b.dataset.ee]));if($('ne'))$('ne').onclick=()=>editE(null);
  $('csv').onclick=()=>sub==='z'?dl(`zeiten_${r.user}_${r.month}.csv`,['Datum;Start;Ende;Pause (min);Netto (h);Tätigkeit;Notiz'].concat(r.entries.map(e=>[d2(e.s),t2(e.s),t2(e.e),Math.round(e.p/60000),String(Math.round(Math.max(0,e.e-e.s-e.p)/36000)/100).replace('.',','),cs(e.act),cs(e.note)].join(';')))):dl(`fahrten_${r.user}_${r.month}.csv`,['Datum;Fahrzeug;km Start;km Ende;km;Von;Nach;Zweck;Getankt;Liter'].concat(r.trips.map(t=>[d2(t.s)+' '+t2(t.s),cs(t.veh),t.kmS,t.kmE,Math.max(0,t.kmE-t.kmS),cs(t.from),cs(t.to),cs(t.purpose),t.fuel?'ja':'',t.liters?String(t.liters).replace('.',','):''].join(';'))));
}
if(!inGoogle){$('lurl').value=lsGet('url')||DEFAULT_URL}else $('conn').hidden=true;
if(token&&(inGoogle||lsGet('url')||DEFAULT_URL)){start()}else $('login').hidden=false;
</script></body></html>
