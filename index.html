<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#11161C"><title>Stempeluhr Admin</title>
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#11161C;--mut:#6B7686;--line:#E1E6EC;--sig:#FFC400;--sigink:#11161C;--blue:#2F6BFF;--ok:#1E9E5A;--bad:#D1352B;--warn:#B77900;--chip:#EEF1F5;--shadow:0 1px 2px rgba(17,22,28,.06),0 6px 18px rgba(17,22,28,.05);--r:16px}

button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--sig);color:var(--sigink)}button.ghost{background:var(--chip);color:var(--ink)}button.danger{background:var(--bad);color:#fff}button.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.top{position:sticky;top:0;z-index:20;background:#11161C;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.01em}.brand i{width:14px;height:14px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 4px rgba(255,196,0,.25)}.brand span{color:var(--sig)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;color:#C9D1DB;padding:8px 11px;border-radius:9px;white-space:nowrap}.tabs button.on{background:var(--sig);color:#11161C}.tabs button:not(.on):hover{background:rgba(255,255,255,.1)}

.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:var(--shadow);border:1px solid var(--line)}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}.kpi small{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.sig{background:var(--sig);border-color:var(--sig);color:#11161C}.kpi.sig small{color:#4a3d00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.emp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}.emp:hover{transform:translateY(-2px);border-color:var(--sig)}
.emp.live{border-color:var(--sig);box-shadow:0 0 0 2px rgba(255,196,0,.35)}
.emp-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}.emp-h b{display:block;line-height:1.2}
.av{width:38px;height:38px;border-radius:50%;background:#11161C;border:1px solid var(--line);color:var(--sig);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.st{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:7px;min-height:20px}.st.on{color:var(--ink);font-weight:650}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}.st.on .pulse{background:var(--sig);box-shadow:0 0 0 0 rgba(255,196,0,.7);animation:p 1.6s infinite}@keyframes p{70%{box-shadow:0 0 0 8px rgba(255,196,0,0)}100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}.nums small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}.nums b{font-size:17px;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.urow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.urow:last-child{border:0}.urow.off{opacity:.55}.urow .who{flex:1;min-width:180px}.urow .who b{display:block}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--chip);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}tr:last-child td{border-bottom:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td:first-child{white-space:nowrap}tfoot td{font-weight:800;background:var(--chip)}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px}.seg button{background:transparent;color:var(--mut);padding:7px 14px}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mnav{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:11px;padding:3px}.mnav button{background:transparent;color:var(--ink);padding:6px 11px}.mnav b{min-width:96px;text-align:center;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty big{display:block;font-size:30px;margin-bottom:6px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:sh 1.2s infinite;height:96px;margin-bottom:12px}@keyframes sh{to{background-position:-200% 0}}

.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:in .2s;max-width:92vw}.toast.bad{background:var(--bad);color:#fff}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:60;padding:16px;animation:in .15s}.modal>div{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}.modal h3{margin-bottom:6px}.modal .row{margin-top:18px;justify-content:flex-end}
#login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,rgba(255,196,0,.18),transparent 45%),var(--bg)}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:370px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.lcard .brand{color:var(--ink);font-size:21px;margin-bottom:4px}.lcard input,.lcard button.pri{width:100%;margin-top:10px}.lcard button.pri{padding:12px;font-size:16px}
.lcard details{margin-top:12px;font-size:13px;color:var(--mut)}.lcard summary{cursor:pointer}.err{color:var(--bad);font-size:13.5px;margin:12px 0 0;line-height:1.4}
.pw{position:relative}.pw button{position:absolute;right:5px;top:15px;padding:5px 9px;background:transparent;color:var(--mut);font-size:13px}
.note{background:rgba(255,196,0,.18);border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:14px}
@media(max-width:1200px){.right .chip{display:none}.tabs{order:3;flex-basis:100%}}
@media(max-width:640px){.top{padding:8px 12px;gap:8px}.tabs{order:3;flex-basis:100%}.right .chip{display:none}main{padding:14px 12px 80px}.kpi b{font-size:24px}}

/* ---- Politur v7.4 ---- */
.tabs button{display:inline-flex;align-items:center;gap:7px}.ti{width:17px;height:17px;flex:none}
tbody tr:nth-child(even) td{background:rgba(127,140,160,.06)}tbody tr:hover td{background:rgba(255,196,0,.10)}
.card>h3{font-size:17px}
.emp{position:relative;overflow:hidden}.emp.live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sig)}
.kpi{position:relative;overflow:hidden}.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,0,.22),transparent 70%)}.kpi.sig::after{display:none}
.dial{width:78px;height:78px;margin:0 auto 10px;display:block}
.lcard{text-align:center}.lcard input,.lcard details,.lcard .err{text-align:left}.lcard .brand{justify-content:center}
main{animation:vin .25s ease}@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:640px){.tabs button span{font-size:13px}.tabs button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){main{animation:none}}
</style></head><body>
<div id="login" hidden><div class="lcard"><svg class="dial" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#11161C"/><circle cx="50" cy="50" r="36" fill="none" stroke="#2a313c" stroke-width="7" stroke-dasharray="1.6 2.6"/><circle cx="50" cy="50" r="36" fill="none" stroke="#FFC400" stroke-width="7" stroke-dasharray="1.6 2.6" pathLength="100" style="stroke-dasharray:1.6 2.6" transform="rotate(-90 50 50)" stroke-dashoffset="0" clip-path="inset(0 0 55% 0)"/><path d="M50 50V30M50 50l12 7" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#FFC400"/></svg><div class="brand"><i></i>Stempeluhr <span>Admin</span></div><small>Anmelden mit deinem Benutzerkonto</small>
<input id="lu" placeholder="Benutzername" autocomplete="username" autocapitalize="off"><div class="pw"><input id="lp" type="password" placeholder="Passwort" autocomplete="current-password"><button type="button" id="lpv" class="ghost">zeigen</button></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={}; const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){mem[k]=v}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){delete mem[k]}}};
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbxNbOOZbxPgP9K9jOaQ0G_THOXuxll98lOm9jNEMnXl7ti9SlU2m6_hZNuQOJhxBLFOlw/exec';   // optional: Web-App-URL fest eintragen (ohne Geheimnisse – die URL ist ohne Login nutzlos)
const inGoogle=!!(window.google&&google.script&&google.script.run);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return mem['ls'+k]||null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem['ls'+k]=v}};
function remote(fn,a){
  const url=($('lurl').value||lsGet('url')||DEFAULT_URL).trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return Promise.reject(new Error('Bitte die Google-Skript-URL (https://script.google.com/…/exec) eintragen.'));
  const body=fn==='adminLogin'?{action:'adminLogin',user:a[0],pass:a[1]}:fn==='adminApi'?{action:'adminApi',token:a[0],act:a[1],p:a[2]}:{action:'adminLogout',token:a[0]};
  return fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json()).then(d=>{if(d.status!=='ok')throw new Error(d.message||'Fehler');return d.r}).catch(e=>{throw new Error(e.message==='Failed to fetch'?'Skript nicht erreichbar – prüfe: 1) URL endet auf /exec (nicht /dev), 2) Bereitstellung: Ausführen als „Ich“, Zugriff „Jeder“, 3) nach Code-Änderungen neue Version veröffentlichen. „Verbindung testen“ muss {"status":"ok"…} zeigen (sonst ist es eine Google-Anmeldeseite = Zugriff falsch).':e.message)});}
const run=(fn,...a)=>inGoogle?new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message||e)))[fn](...a)):remote(fn,a);

let token=ss.get('tok'),role=ss.get('role')||'',tab='home',month=new Date().toLocaleDateString('sv-SE').slice(0,7),cur=null,sub='z',timer=null,q='';
const hm=s=>Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0');
const d2=ms=>new Date(ms).toLocaleDateString('de-DE'),t2=ms=>new Date(ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),dt2=ms=>ms?d2(ms)+' '+t2(ms):'–';
const rel=ms=>{if(!ms)return'noch nie';const m=Math.round((Date.now()-ms)/60000);return m<1?'gerade eben':m<60?`vor ${m} Min.`:m<1440?`vor ${Math.round(m/60)} Std.`:`vor ${Math.round(m/1440)} Tg.`};
const init=n=>String(n).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const RL={dev:'Entwickler',admin:'Admin',user:'Mitarbeiter'},rchip=r=>`<span class="chip ${r==='dev'?'dev':r==='admin'?'adm':''}">${RL[r]||esc(r)}</span>`;
const mshift=(m,d)=>{const [y,mo]=m.split('-').map(Number);const x=new Date(y,mo-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const mlabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})};
function toast(m,bad){if(!m)return;const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),bad?6000:2800)}
function ask(title,text,okLabel,danger){return new Promise(res=>{const b=$('modalbox');b.innerHTML=`<div class="modal"><div><h3>${esc(title)}</h3><div class="mut">${esc(text)}</div><div class="row"><button class="ghost" id="mn">Abbrechen</button><button class="${danger?'danger':'pri'}" id="my">${esc(okLabel||'OK')}</button></div></div></div>`;$('mn').onclick=()=>{b.innerHTML='';res(false)};$('my').onclick=()=>{b.innerHTML='';res(true)}})}
const skel=n=>Array.from({length:n},()=>'<div class="sk"></div>').join('');
async function api(a,p){const r=await run('adminApi',token,a,p||{});if(!r.ok){if(r.code===401){logout(true);throw new Error(r.msg||'Bitte neu anmelden.')}throw new Error(r.msg||'Fehler')}return r}
async function act(a,p,after){try{const r=await api(a,p);toast(r.msg||'Gespeichert');(after||render)();return r}catch(e){toast(e.message,true)}}
function logout(silent){if(token)run('adminLogout',token).catch(()=>{});ss.del('tok');token=null;clearInterval(timer);$('app').hidden=true;$('login').hidden=false;if(silent)$('le').textContent='Sitzung abgelaufen – bitte neu anmelden.'}
$('out').onclick=()=>logout();
$('lpv').onclick=()=>{const p=$('lp');p.type=p.type==='password'?'text':'password';$('lpv').textContent=p.type==='password'?'zeigen':'verbergen'};
$('lt').onclick=()=>{$('lt').href=$('lurl').value.trim()||DEFAULT_URL};
$('lb').onclick=async()=>{$('le').textContent='';if(!inGoogle)lsSet('url',($('lurl').value||DEFAULT_URL).trim());$('lb').disabled=true;$('lb').textContent='Anmelden …';
  try{const r=await run('adminLogin',$('lu').value.trim(),$('lp').value);if(!r.ok){$('le').textContent=r.msg;return}token=r.token;role=r.role;ss.set('tok',token);ss.set('role',role);ss.set('me',r.user);ss.set('who',r.name+' · '+r.roleLabel);$('lp').value='';start()}
  catch(e){$('le').textContent=e.message;if(/nicht erreichbar|URL/.test(e.message))$('conn').open=true}finally{$('lb').disabled=false;$('lb').textContent='Anmelden'}};
['lp','lu'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('lb').click()}));
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;lsSet('theme',n)};
if(lsGet('theme'))document.documentElement.dataset.theme=lsGet('theme');
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.2 3.5 5"/>',tasks:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 12l2.5 2.5L16 9"/>',msgs:'<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',veh:'<path d="M3 15v-4l2-5h14l2 5v4M3 15h18M3 15v3h3v-3m12 0v3h3v-3"/><circle cx="7.5" cy="12.5" r=".8"/><circle cx="16.5" cy="12.5" r=".8"/>',sys:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const ic=k=>`<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;
const TABS=[['home','Übersicht'],['users','Benutzer'],['tasks','Aufgaben'],['msgs','Nachrichten'],['veh','Fahrzeuge']];
function start(){$('login').hidden=true;$('app').hidden=false;$('who').textContent=ss.get('who')||'';
  const tabs=TABS.concat(role==='dev'?[['sys','System']]:[]);
  $('tabs').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${tab===k&&!cur?'on':''}">${ic(k)}<span>${l}</span></button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;q='';start()});
  render();clearInterval(timer);timer=setInterval(()=>{if(tab==='home'&&!cur&&!document.hidden&&!document.activeElement.matches('input,select'))render(true)},60000)}
const me=()=>ss.get('me')||'';
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
async function render(quiet){
  const v=$('view');if(!quiet)v.innerHTML=skel(3);
  try{
    if(cur)return await renderUser();
    if(tab==='home')await home(v);else if(tab==='users')await users(v);else if(tab==='tasks')await tasks(v);else if(tab==='msgs')await msgs(v);else if(tab==='veh')await vehicles(v);else if(tab==='sys')await system(v);
  }catch(e){if(token)v.innerHTML=`<div class="card empty"><big>⚠️</big>${esc(e.message)}<div class="row" style="justify-content:center;margin-top:12px"><button class="pri" onclick="render()">Erneut versuchen</button></div></div>`}
}
async function home(v){
  const r=await api('overview',{month});const rows=r.rows.filter(o=>!q||(o.name+' '+o.user).toLowerCase().includes(q.toLowerCase()));const liveN=r.rows.filter(o=>o.live).length;

  <div class="kpis"><div class="kpi sig"><small>Jetzt eingestempelt</small><b>${liveN}<span style="font-size:15px;font-weight:600"> / ${r.rows.length}</span></b></div><div class="kpi"><small>Stunden heute</small><b>${hm(sum(r.rows,'today'))}</b></div><div class="kpi"><small>Stunden Monat</small><b>${hm(sum(r.rows,'month'))}</b></div><div class="kpi"><small>km Monat</small><b>${sum(r.rows,'km').toLocaleString('de-DE')}</b></div><div class="kpi"><small>Offene Aufgaben</small><b>${sum(r.rows,'tasks')}</b></div></div>

  ${rows.length?`<div class="grid">${rows.map(o=>`<div class="emp ${o.live?'live':''}" data-u="${esc(o.user)}"><div class="emp-h"><div class="av">${esc(init(o.name))}</div><div style="min-width:0"><b>${esc(o.name)}</b><small>${esc(RL[o.role]||o.role)}${o.cars&&o.cars.length?' · 🚐 '+esc(o.cars.join(', ')):''}</small></div></div>
  <div class="st ${o.live?'on':''}"><span class="pulse"></span>${esc(o.status)}${o.trip?' · Fahrzeug '+esc(o.trip):''}</div>
  <div class="nums"><div><small>Heute</small><b>${hm(o.today)}</b></div><div><small>Monat</small><b>${hm(o.month)}</b></div><div><small>km</small><b>${o.km.toLocaleString('de-DE')}</b></div></div>
  <div class="foot"><span>Sync ${rel(o.sync)}</span><span>${o.tasks?o.tasks+' Aufgabe'+(o.tasks>1?'n':'')+' offen':'keine Aufgaben'}</span></div></div>`).join('')}</div>`:`<div class="card empty"><big>🔍</big>Keine Person gefunden.</div>`}`;
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{month=mshift(month,+b.dataset.m);render()});
  v.querySelectorAll('[data-u]').forEach(a=>a.onclick=()=>{cur=a.dataset.u;sub='z';start()});
  $('sq').oninput=e=>{q=e.target.value;clearTimeout(window.__qt);window.__qt=setTimeout(()=>{home(v).then(()=>{const i=$('sq');i.focus();i.setSelectionRange(q.length,q.length)})},250)};
  $('rl').onclick=()=>act('refreshLogs');
}
async function users(v){
  const r=await api('users');

  <div class="row"><input type="password" placeholder="neues Passwort" style="width:150px" data-pw="${esc(u.user)}"><button class="ghost sm" data-set="${esc(u.user)}">Setzen</button>${u.user===me()?'':`<button class="ghost sm" data-tg="${esc(u.user)}">${u.active?'Sperren':'Entsperren'}</button>${role==='dev'?`<select data-rs="${esc(u.user)}">${Object.keys(r.roles).map(k=>`<option value="${k}" ${k===u.role?'selected':''}>${esc(r.roles[k])}</option>`).join('')}</select><button class="ghost sm" data-rb="${esc(u.user)}">Rolle ändern</button>`:''}`}</div></div>`).join('')}</div>

  v.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{if(await ask(b.textContent+'?',b.dataset.tg+' – alle Geräte werden abgemeldet.',b.textContent,b.textContent==='Sperren'))act('toggle',{user:b.dataset.tg})});

async function tasks(v){
  const [r,u]=await Promise.all([api('tasks'),api('users')]);const open=r.tasks.filter(t=>!t.done).length;

  <div class="card"><h3>Alle Aufgaben</h3>${r.tasks.length?`<div class="tw"><table><thead><tr><th>Mitarbeiter</th><th>Aufgabe</th><th>Fällig</th><th>Status</th><th></th></tr></thead><tbody>${r.tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.prio?'<span class="chip bad">wichtig</span> ':''}${esc(t.title)}${t.note?`<br><small>${esc(t.note)}</small>`:''}</td><td>${esc(t.due||'–')}</td><td>${t.done?`<span class="chip ok">erledigt ${d2(t.done)}</span>`:'<span class="chip warn">offen</span>'}</td><td><button class="ghost sm" data-dt="${t.id}">Löschen</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><big>✅</big>Noch keine Aufgaben.</div>'}</div>`;
  $('ab').onclick=()=>act('assign',{to:$('at').value,title:$('ati').value,due:$('ad').value,note:$('an').value,prio:$('ap').checked});
  v.querySelectorAll('[data-dt]').forEach(b=>b.onclick=async()=>{if(await ask('Aufgabe löschen?','Sie verschwindet auch in der App.','Löschen',true))act('delTask',{id:b.dataset.dt})});
}
async function msgs(v){
  const [r,u]=await Promise.all([api('messages'),api('users')]);
  v.innerHTML=`<div class="head"><h2>Nachrichten</h2></div><div class="card"><h3>Nachricht senden</h3><div class="row"><select id="mt"><option value="all">Alle Mitarbeiter</option>${u.users.filter(x=>x.active&&x.role==='user').map(x=>`<option value="${esc(x.user)}">${esc(x.name)}</option>`).join('')}</select><input id="mti" class="grow" placeholder="Titel" maxlength="80"><input id="mb" class="grow" style="flex:2" placeholder="Text (optional)" maxlength="500"><button class="pri" id="mbn">Senden</button></div><p class="mut" style="font-size:13px;margin:10px 0 0">Erscheint in der App als Karte und Benachrichtigung (beim Öffnen, danach etwa alle 2 Minuten), bis „Gelesen“ gedrückt wird.</p></div>
  <div class="card"><h3>Zuletzt gesendet</h3>${r.msgs.length?`<div class="tw"><table><thead><tr><th>An</th><th>Titel</th><th>Gesendet</th><th>Gelesen</th></tr></thead><tbody>${r.msgs.map(m=>`<tr><td>${esc(m.user)}</td><td>${esc(m.title)}</td><td>${dt2(m.created)}</td><td>${m.read?`<span class="chip ok">${dt2(m.read)}</span>`:'<span class="chip warn">offen</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><big>💬</big>Noch keine Nachrichten.</div>'}</div>`;
  $('mbn').onclick=()=>act('sendMsg',{to:$('mt').value,title:$('mti').value,body:$('mb').value});
}
const days=d=>d?Math.floor((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5):null;
const due=d=>{if(!d)return'<span class="mut">–</span>';const n=days(d),l=new Date(d+'T00:00:00').toLocaleDateString('de-DE');return n<0?`<span class="chip bad">${l} · überfällig</span>`:n<=30?`<span class="chip warn">${l} · in ${n} Tg.</span>`:`<span class="chip ok">${l}</span>`};
async function vehicles(v){
  const r=await api('vehicles'),pn=Object.fromEntries((r.people||[]).map(x=>[x.user,x.name])),soon=r.vehicles.filter(x=>[x.tuev,x.service].some(d=>d&&days(d)<=30));
  v.innerHTML=`<div class="head"><h2>Fahrzeuge</h2></div>${soon.length?`<div class="note">Fristen fällig oder bald fällig: <b>${esc(soon.map(x=>x.plate).join(', '))}</b></div>`:''}
  <div class="grid">${r.vehicles.map(x=>`<div class="card" style="margin:0"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(x.plate)}</h3><small>${esc(x.name)||'–'}</small></div>${x.l100!=null?`<span class="chip">${String(x.l100).replace('.',',')} l/100 km</span>`:'<span class="chip">Verbrauch –</span>'}</div>
  <div style="margin:10px 0 4px"><small>Fahrer</small> ${(x.drivers||[]).length?x.drivers.map(d=>`<span class="chip adm">${esc(pn[d]||d)}</span>`).join(' '):'<span class="chip">niemand zugeordnet</span>'}</div>
  <div style="margin:4px 0"><small>TÜV</small> ${due(x.tuev)}</div><div><small>Service</small> ${due(x.service)}</div>
  <details style="margin-top:10px"><summary class="mut" style="cursor:pointer;font-size:13px">Fahrer zuweisen</summary><div class="row" style="margin-top:8px;gap:6px 14px">${(r.people||[]).map(pp=>`<label class="row" style="gap:5px"><input type="checkbox" data-dr="${esc(x.plate)}" value="${esc(pp.user)}" ${(x.drivers||[]).includes(pp.user)?'checked':''}> ${esc(pp.name)}</label>`).join('')||'<small>Keine Mitarbeiter.</small>'}</div></details>
  <div class="row" style="margin-top:12px"><input type="date" value="${esc(x.tuev)}" data-tv="${esc(x.plate)}" title="TÜV"><input type="date" value="${esc(x.service)}" data-sv="${esc(x.plate)}" title="Service"></div>
  <div class="row" style="margin-top:8px"><button class="ghost sm" data-vs="${esc(x.plate)}" data-n="${esc(x.name)}">Speichern</button><button class="ghost sm" data-vd="${esc(x.plate)}">Löschen</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1"><big>🚐</big>Noch keine Fahrzeuge.</div>'}</div>
  <div class="card" style="margin-top:16px"><h3>Fahrzeug anlegen</h3><div class="row"><input id="vp" placeholder="Kennzeichen" maxlength="20"><input id="vn" class="grow" placeholder="Bezeichnung" maxlength="60"><label class="row" style="gap:6px"><small>TÜV</small><input id="vt" type="date"></label><label class="row" style="gap:6px"><small>Service</small><input id="vsv" type="date"></label><button class="pri" id="vb">Anlegen</button></div>
  <details style="margin-top:10px"><summary class="mut" style="cursor:pointer;font-size:13px">Fahrer zuweisen (optional)</summary><div class="row" style="margin-top:8px;gap:6px 14px">${(r.people||[]).map(pp=>`<label class="row" style="gap:5px"><input type="checkbox" data-dr="__new" value="${esc(pp.user)}"> ${esc(pp.name)}</label>`).join('')}</div></details><p class="mut" style="font-size:13px;margin:10px 0 0">Verbrauch = Näherung aus den Tankungen (Volltanken angenommen, mind. 2 Tankungen). Zugeordnete Fahrer sehen ihr Fahrzeug in der App vorausgewählt (ohne Zuordnung erscheinen alle). Fristen ≤ 30 Tage werden dort angezeigt.</p></div>`;
  v.querySelectorAll('[data-vs]').forEach(b=>b.onclick=()=>act('vehSave',{plate:b.dataset.vs,name:b.dataset.n,tuev:v.querySelector(`[data-tv="${b.dataset.vs}"]`).value,service:v.querySelector(`[data-sv="${b.dataset.vs}"]`).value,drivers:[...v.querySelectorAll(`[data-dr="${b.dataset.vs}"]:checked`)].map(c=>c.value)}));
  v.querySelectorAll('[data-vd]').forEach(b=>b.onclick=async()=>{if(await ask('Fahrzeug löschen?',b.dataset.vd,'Löschen',true))act('vehDel',{plate:b.dataset.vd})});
  $('vb').onclick=()=>act('vehSave',{plate:$('vp').value,name:$('vn').value,tuev:$('vt').value,service:$('vsv').value,drivers:[...v.querySelectorAll('[data-dr="__new"]:checked')].map(c=>c.value)});
}
async function system(v){
  const [b,a]=await Promise.all([api('backups'),api('activity')]);
  v.innerHTML=`<div class="head"><h2>System</h2></div><div class="card"><h3>Sicherungen <small>täglich ca. 3 Uhr · letzte 14 im Drive-Ordner „Stempeluhr Backups“</small></h3>${b.files.length?`<div class="tw"><table><thead><tr><th>Datei</th><th>Erstellt</th></tr></thead><tbody>${b.files.map(f=>`<tr><td>${esc(f.name)}</td><td>${dt2(f.ts)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Noch keine Sicherung.</div>'}<div class="row" style="margin-top:12px"><button class="pri" id="bn">Jetzt sichern</button></div></div>
  <div class="card"><h3>Aktivität <small>letzte 150</small></h3><div class="tw" style="max-height:420px"><table><thead><tr><th>Zeit</th><th>Wer</th><th>Aktion</th><th>Details</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('bn').onclick=()=>act('backupNow');
}
async function renderUser(){
  const v=$('view');const r=await api('userView',{user:cur,month});let tot=0,km=0,lit=0;const dayset=new Set();
  r.entries.forEach(e=>{tot+=Math.max(0,(e.e-e.s-e.p)/1000);dayset.add(d2(e.s))});r.trips.forEach(t=>{km+=Math.max(0,t.kmE-t.kmS);lit+=t.liters||0});
  const cs=x=>{x=String(x==null?'':x).replace(/[\r\n;]+/g,' ');return /^[=+\-@]/.test(x)?"'"+x:x};
  const dl=(name,lines)=>{const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  v.innerHTML=`<div class="head"><button class="ghost sm" id="bk">‹ Zurück</button><h2>${esc(r.name)}</h2><div class="mnav"><button data-m="-1">‹</button><b>${esc(mlabel(r.month))}</b><button data-m="1">›</button></div></div>
  <div class="kpis"><div class="kpi sig"><small>Netto-Stunden</small><b>${hm(tot)}</b></div><div class="kpi"><small>Arbeitstage</small><b>${dayset.size}</b></div><div class="kpi"><small>Ø pro Tag</small><b>${dayset.size?hm(tot/dayset.size):'0:00'}</b></div><div class="kpi"><small>Fahrten · km</small><b>${r.trips.length} · ${km.toLocaleString('de-DE')}</b></div><div class="kpi"><small>Getankt</small><b>${lit?String(Math.round(lit*10)/10).replace('.',',')+' l':'–'}</b></div></div>
  <div class="row" style="margin-bottom:12px"><div class="seg"><button data-s="z" class="${sub==='z'?'on':''}">Zeiten (${r.entries.length})</button><button data-s="f" class="${sub==='f'?'on':''}">Fahrtenbuch (${r.trips.length})</button></div><span class="grow"></span><button class="ghost sm" id="csv">${sub==='z'?'Zeiten':'Fahrtenbuch'} als CSV</button></div>
  ${r.locks.length?`<div class="note">Fahrtenbuch abgeschlossen: ${r.locks.map(l=>esc(l.a)+' am '+dt2(l.ts)).join('; ')}</div>`:''}
  ${sub==='z'?(r.entries.length?`<div class="tw"><table><thead><tr><th>Datum</th><th>Start</th><th>Ende</th><th class="n">Pause</th><th class="n">Netto</th><th>Tätigkeit</th><th>Notiz</th></tr></thead><tbody>${r.entries.map(e=>`<tr><td>${d2(e.s)}</td><td>${t2(e.s)}</td><td>${t2(e.e)}</td><td class="n">${Math.round(e.p/60000)} min</td><td class="n">${hm(Math.max(0,(e.e-e.s-e.p)/1000))}</td><td>${esc(e.act)}</td><td>${esc(e.note)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Summe</td><td class="n">${hm(tot)} h</td><td colspan="2"></td></tr></tfoot></table></div>`:'<div class="card empty"><big>🕒</big>Keine Zeiten in diesem Monat.</div>')
  :(r.trips.length?`<div class="tw"><table><thead><tr><th>Datum</th><th>Fahrzeug</th><th class="n">km Start</th><th class="n">km Ende</th><th class="n">km</th><th>Von → Nach</th><th>Zweck</th><th>Getankt</th></tr></thead><tbody>${r.trips.map(t=>`<tr><td>${d2(t.s)} ${t2(t.s)}</td><td>${esc(t.veh)}</td><td class="n">${t.kmS}</td><td class="n">${t.kmE}</td><td class="n">${Math.max(0,t.kmE-t.kmS)}</td><td>${esc(t.from)} → ${esc(t.to)}</td><td>${esc(t.purpose)}</td><td>${t.fuel?'<span class="chip warn">⛽ '+(t.liters?String(t.liters).replace('.',',')+' l':'ja')+'</span>':''}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Summe</td><td class="n">${km} km</td><td colspan="3"></td></tr></tfoot></table></div>`:'<div class="card empty"><big>🚐</big>Keine Fahrten in diesem Monat.</div>')}`;
  $('bk').onclick=()=>{cur=null;start()};
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{month=mshift(month,+b.dataset.m);render()});
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
  $('csv').onclick=()=>sub==='z'?dl(`zeiten_${r.user}_${r.month}.csv`,['Datum;Start;Ende;Pause (min);Netto (h);Tätigkeit;Notiz'].concat(r.entries.map(e=>[d2(e.s),t2(e.s),t2(e.e),Math.round(e.p/60000),String(Math.round(Math.max(0,e.e-e.s-e.p)/36000)/100).replace('.',','),cs(e.act),cs(e.note)].join(';')))):dl(`fahrten_${r.user}_${r.month}.csv`,['Datum;Fahrzeug;km Start;km Ende;km;Von;Nach;Zweck;Getankt;Liter'].concat(r.trips.map(t=>[d2(t.s)+' '+t2(t.s),cs(t.veh),t.kmS,t.kmE,Math.max(0,t.kmE-t.kmS),cs(t.from),cs(t.to),cs(t.purpose),t.fuel?'ja':'',t.liters?String(t.liters).replace('.',','):''].join(';'))));
}
if(!inGoogle){$('lurl').value=lsGet('url')||DEFAULT_URL}else $('conn').hidden=true;
if(token&&(inGoogle||lsGet('url')||DEFAULT_URL)){start()}else $('login').hidden=false;
</script></body></html>
